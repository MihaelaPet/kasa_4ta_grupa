<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Каса – 4 група</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    header {
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #6b7280;
      margin: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
    }

    .card-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
    }

    .paid {
      margin-bottom: 25px;
    }

    .section {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      overflow-x: auto;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-weight: bold;
    }

    td.amount,
    th.amount {
      text-align: right;
    }

    .empty {
      color: #6b7280;
      padding: 15px 0;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 30px;
    }

    .error {
      background: #fff1f2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 27px;
      }

      .container {
        padding: 20px 12px 40px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Каса – 4 група</h1>
    <p class="subtitle">Информационна таблица · само за преглед</p>
  </header>

  <div id="content">
    Зареждане на данните...
  </div>

  <footer>
    Страницата е само за преглед. Посетителите не могат да редактират таблицата.
  </footer>

</div>

<script>

const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKH2WDdHEv8bgN3Ck4sB_oUSGuOasU5avE2DDTxbQcebIUgoOBLIsIpA7_VHfK2g/pub?gid=1968436123&single=true&output=csv";


/* -------------------------------------------------------
   CSV READER
------------------------------------------------------- */

function parseCSV(text) {

  const rows = [];
  let row = [];
  let cell = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {

      cell += '"';
      i++;

    } else if (char === '"') {

      insideQuotes = !insideQuotes;

    } else if (char === "," && !insideQuotes) {

      row.push(cell);
      cell = "";

    } else if ((char === "\n" || char === "\r") && !insideQuotes) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell);
      cell = "";

      /*
        ВАЖНО:
        Тук НЕ махаме празните редове.
        Така структурата на Google Sheet
        остава точно същата.
      */

      rows.push(row);
      row = [];

    } else {

      cell += char;
    }
  }

  if (cell !== "" || row.length > 0) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}


/* -------------------------------------------------------
   HELPERS
------------------------------------------------------- */

function clean(value) {

  return String(value ?? "").trim();
}


function normalize(value) {

  return clean(value)
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}


function numberValue(value) {

  if (value === null || value === undefined) {
    return 0;
  }

  let text = String(value)
    .replace(/€/g, "")
    .replace(/\s/g, "")
    .trim();

  if (!text) {
    return 0;
  }

  /*
    Поддържа:
    50
    50,00
    50.00
    1.234,56
  */

  if (text.includes(",") && text.includes(".")) {

    text = text
      .replace(/\./g, "")
      .replace(",", ".");

  } else {

    text = text.replace(",", ".");
  }

  const result = parseFloat(text);

  return Number.isFinite(result) ? result : 0;
}


function euro(value) {

  return new Intl.NumberFormat("bg-BG", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(value) + " €";
}


/* -------------------------------------------------------
   FIND ROW / COLUMN
------------------------------------------------------- */

function findRowByText(rows, text) {

  const wanted = normalize(text);

  for (let i = 0; i < rows.length; i++) {

    for (let j = 0; j < rows[i].length; j++) {

      if (normalize(rows[i][j]) === wanted) {
        return i;
      }
    }
  }

  return -1;
}


function findColumn(headers, possibleNames) {

  for (let i = 0; i < headers.length; i++) {

    const current = normalize(headers[i]);

    for (const name of possibleNames) {

      if (current === normalize(name)) {
        return i;
      }
    }
  }

  return -1;
}


/* -------------------------------------------------------
   MAIN
------------------------------------------------------- */

async function loadData() {

  const content = document.getElementById("content");

  try {

    const response = await fetch(
      CSV_URL + "&v=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Google Sheets не може да бъде зареден.");
    }

    const csvText = await response.text();

    const rows = parseCSV(csvText);


    /* ---------------------------------------------------
       SUMMARY

       B3 = наличност от миналата година
    --------------------------------------------------- */

    const openingBalance =
      numberValue(rows[2]?.[1]);


    /* ---------------------------------------------------
       FIND INCOME HEADER ROW

       Търсим:
       "Дата на приход"
    --------------------------------------------------- */

    const incomeHeaderRow =
      findRowByText(rows, "Дата на приход");


    if (incomeHeaderRow === -1) {
      throw new Error(
        "Не е намерен редът с приходите."
      );
    }


    const incomeHeaders =
      rows[incomeHeaderRow];


    const incomeDateCol =
      findColumn(
        incomeHeaders,
        ["Дата на приход"]
      );


    const incomeDescriptionCol =
      findColumn(
        incomeHeaders,
        ["Описание на прихода"]
      );


    const incomeAmountCol =
      findColumn(
        incomeHeaders,
        ["Приход €", "Приход"]
      );


    const paymentMethodCol =
      findColumn(
        incomeHeaders,
        ["Начин на плащане"]
      );


    const statusCol =
      findColumn(
        incomeHeaders,
        ["Статус"]
      );


    /* ---------------------------------------------------
       FIND EXPENSE HEADER ROW

       Търсим:
       "Дата на разход"
    --------------------------------------------------- */

    const expenseHeaderRow =
      findRowByText(rows, "Дата на разход");


    if (expenseHeaderRow === -1) {
      throw new Error(
        "Не е намерен редът с разходите."
      );
    }


    const expenseHeaders =
      rows[expenseHeaderRow];


    const expenseDateCol =
      findColumn(
        expenseHeaders,
        ["Дата на разход"]
      );


    const expenseReasonCol =
      findColumn(
        expenseHeaders,
        ["Основание за разход"]
      );


    const expenseAmountCol =
      findColumn(
        expenseHeaders,
        ["Разход €", "Разход"]
      );


    /* ---------------------------------------------------
       INCOMES
    --------------------------------------------------- */

    const incomes = [];

    let incomeTotal = 0;


    /*
      Започваме от реда СЛЕД заглавието.
      Четем до края на таблицата.

      Празните редове не пречат.
    */

    for (
      let i = incomeHeaderRow + 1;
      i < rows.length;
      i++
    ) {

      const row = rows[i] || [];


      const date =
        clean(row[incomeDateCol]);


      const description =
        clean(row[incomeDescriptionCol]);


      const amount =
        numberValue(row[incomeAmountCol]);


      const payment =
        clean(row[paymentMethodCol]);


      const status =
        clean(row[statusCol]);


      /*
        Ако редът е напълно празен,
        не го добавяме.
      */

      if (
        !date &&
        !description &&
        !payment &&
        !status &&
        amount === 0
      ) {
        continue;
      }


      /*
        Спираме, ако случайно стигнем
        до началото на друга секция.
      */

      if (
        normalize(date) === "дата на разход"
      ) {
        break;
      }


      incomes.push({

        date,
        description,
        amount,
        payment,
        status

      });


      if (amount !== 0) {
        incomeTotal += amount;
      }
    }


    /* ---------------------------------------------------
       EXPENSES
    --------------------------------------------------- */

    const expenses = [];

    let expenseTotal = 0;


    for (
      let i = expenseHeaderRow + 1;
      i < rows.length;
      i++
    ) {

      const row = rows[i] || [];


      const date =
        clean(row[expenseDateCol]);


      const reason =
        clean(row[expenseReasonCol]);


      const amount =
        numberValue(row[expenseAmountCol]);


      if (
        !date &&
        !reason &&
        amount === 0
      ) {
        continue;
      }


      expenses.push({

        date,
        reason,
        amount

      });


      if (amount !== 0) {
        expenseTotal += amount;
      }
    }


    /* ---------------------------------------------------
       BALANCE

       Наличност =
       стара наличност
       + приходи
       - разходи
    --------------------------------------------------- */

    const balance =
      openingBalance +
      incomeTotal -
      expenseTotal;


    /* ---------------------------------------------------
       PAID / TOTAL

       БРОИМ САМО СТАТУСИТЕ.

       "Платена" = платил
       "Неплатена" = не е платил

       Начинът на плащане НЕ влияе.
    --------------------------------------------------- */

    const paidCount =
      incomes.filter(
        item =>
          normalize(item.status) === "платена"
      ).length;


    const totalPeople =
      incomes.filter(
        item =>
          normalize(item.status) === "платена" ||
          normalize(item.status) === "неплатена"
      ).length;


    /* ---------------------------------------------------
       HTML
    --------------------------------------------------- */

    let html = "";


    /* CARDS */

    html += `

      <div class="cards">

        <div class="card">

          <div class="card-title">
            🏦 Наличност от миналата година
          </div>

          <div class="card-value">
            ${euro(openingBalance)}
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            💰 Общо приходи
          </div>

          <div class="card-value">
            ${euro(incomeTotal)}
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            🧾 Общо разходи
          </div>

          <div class="card-value">
            ${euro(expenseTotal)}
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            💶 Наличност
          </div>

          <div class="card-value">
            ${euro(balance)}
          </div>

        </div>

      </div>
    `;


    /* PAID */

    html += `

      <div class="section paid">

        <h2>
          👨‍👩‍👧‍👦 Такси
        </h2>

        <div class="card-value">
          ${paidCount}/${totalPeople} платили
        </div>

      </div>

    `;


    /* INCOMES */

    html += `

      <div class="section">

        <h2>
          Приходи
        </h2>

        ${
          incomes.length === 0

          ?

          `
            <div class="empty">
              Няма въведени приходи.
            </div>
          `

          :

          `

            <table>

              <thead>

                <tr>

                  <th>
                    Дата
                  </th>

                  <th>
                    Описание
                  </th>

                  <th class="amount">
                    Приход
                  </th>

                  <th>
                    Начин на плащане
                  </th>

                  <th>
                    Статус
                  </th>

                </tr>

              </thead>


              <tbody>

                ${
                  incomes.map(item => `

                    <tr>

                      <td>
                        ${item.date}
                      </td>

                      <td>
                        ${item.description}
                      </td>

                      <td class="amount">
                        ${
                          item.amount
                            ? euro(item.amount)
                            : ""
                        }
                      </td>

                      <td>
                        ${item.payment}
                      </td>

                      <td>
                        ${item.status}
                      </td>

                    </tr>

                  `).join("")
                }

              </tbody>

            </table>

          `
        }

      </div>

    `;


    /* EXPENSES */

    html += `

      <div class="section">

        <h2>
          Разходи
        </h2>

        ${
          expenses.length === 0

          ?

          `
            <div class="empty">
              Няма въведени разходи.
            </div>
          `

          :

          `

            <table>

              <thead>

                <tr>

                  <th>
                    Дата
                  </th>

                  <th>
                    Основание
                  </th>

                  <th class="amount">
                    Разход
                  </th>

                </tr>

              </thead>


              <tbody>

                ${
                  expenses.map(item => `

                    <tr>

                      <td>
                        ${item.date}
                      </td>

                      <td>
                        ${item.reason}
                      </td>

                      <td class="amount">
                        ${
                          item.amount
                            ? euro(item.amount)
                            : ""
                        }
                      </td>

                    </tr>

                  `).join("")
                }

              </tbody>

            </table>

          `
        }

      </div>

    `;


    content.innerHTML = html;


  } catch (error) {

    console.error(error);

    content.innerHTML = `

      <div class="error">

        Данните не могат да бъдат заредени
        в момента.

        <br><br>

        Проверете дали Google Sheet
        е публикуван в мрежата.

      </div>

    `;
  }
}


/* START */

loadData();

</script>

</body>
</html>
