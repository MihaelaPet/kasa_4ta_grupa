<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Каса – 4 група</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    header {
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #6b7280;
      margin: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .card-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
    }

    .paid {
      margin-bottom: 30px;
    }

    .section {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      overflow-x: auto;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-weight: bold;
    }

    td.amount,
    th.amount {
      text-align: right;
    }

    .empty {
      color: #6b7280;
      padding: 15px 0;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 30px;
    }

    .error {
      background: #fff1f2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 27px;
      }

      .container {
        padding: 20px 12px 40px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Каса – 4 група</h1>
    <p class="subtitle">Информационна таблица · само за преглед</p>
  </header>

  <div id="content">
    Зареждане на данните...
  </div>

  <footer>
    Страницата е само за преглед. Посетителите не могат да редактират таблицата.
  </footer>

</div>

<script>

const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKH2WDdHEv8bgN3Ck4sB_oUSGuOasU5avE2DDTxbQcebIUgoOBLIsIpA7_VHfK2g/pub?gid=1968436123&single=true&output=csv";

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === "," && !insideQuotes) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (char === "\r" && next === "\n") i++;

      row.push(cell);
      cell = "";

      if (row.some(value => value.trim() !== "")) {
        rows.push(row);
      }

      row = [];
    } else {
      cell += char;
    }
  }

  if (cell !== "" || row.length > 0) {
    row.push(cell);

    if (row.some(value => value.trim() !== "")) {
      rows.push(row);
    }
  }

  return rows;
}

function numberValue(value) {
  if (!value) return 0;

  let text = String(value)
    .replace(/€/g, "")
    .replace(/\s/g, "")
    .trim();

  if (text.includes(",") && text.includes(".")) {
    text = text.replace(/\./g, "").replace(",", ".");
  } else {
    text = text.replace(",", ".");
  }

  const number = parseFloat(text);

  return isNaN(number) ? 0 : number;
}

function euro(value) {
  return new Intl.NumberFormat("bg-BG", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(value) + " €";
}

function clean(value) {
  return (value || "").trim();
}

async function loadData() {

  const content = document.getElementById("content");

  try {

    const response = await fetch(CSV_URL + "&v=" + Date.now());

    if (!response.ok) {
      throw new Error("Google Sheets не може да бъде зареден.");
    }

    const text = await response.text();
    const rows = parseCSV(text);

    /*
      Google Sheet:
      B3 = наличност от миналата година
      B4 = общо приходи
      B5 = общо разходи
      B6 = наличност

      A14:E43 = приходи
      G14:I44 = разходи
    */

    const openingBalance = numberValue(rows[2]?.[1]);

    let incomeTotal = 0;
    let expenseTotal = 0;

    const incomes = [];
    const expenses = [];

    // Приходи – редове 14–43
    for (let i = 13; i <= 42; i++) {

      const row = rows[i] || [];

      const date = clean(row[0]);
      const description = clean(row[1]);
      const amount = numberValue(row[2]);
      const payment = clean(row[3]);
      const status = clean(row[4]);

      if (description || amount || date || payment || status) {

        if (amount !== 0) {
          incomeTotal += amount;
        }

        incomes.push({
          date,
          description,
          amount,
          payment,
          status
        });
      }
    }

    // Разходи – редове 14–44
    for (let i = 13; i <= 43; i++) {

      const row = rows[i] || [];

      const date = clean(row[6]);
      const reason = clean(row[7]);
      const amount = numberValue(row[8]);

      if (date || reason || amount) {

        if (amount !== 0) {
          expenseTotal += amount;
        }

        expenses.push({
          date,
          reason,
          amount
        });
      }
    }

    const balance = openingBalance + incomeTotal - expenseTotal;

    const paidCount = incomes.filter(
      item => item.status.toLowerCase() === "платена"
    ).length;

    const totalPeople = incomes.filter(
      item => item.status !== ""
    ).length;

    let html = "";

    html += `
      <div class="cards">

        <div class="card">
          <div class="card-title">🏦 Наличност от миналата година</div>
          <div class="card-value">${euro(openingBalance)}</div>
        </div>

        <div class="card">
          <div class="card-title">💰 Общо приходи</div>
          <div class="card-value">${euro(incomeTotal)}</div>
        </div>

        <div class="card">
          <div class="card-title">🧾 Общо разходи</div>
          <div class="card-value">${euro(expenseTotal)}</div>
        </div>

        <div class="card">
          <div class="card-title">💶 Наличност</div>
          <div class="card-value">${euro(balance)}</div>
        </div>

      </div>
    `;

    html += `
      <div class="section paid">
        <h2>👨‍👩‍👧‍👦 Такси</h2>
        <div class="card-value">${paidCount}/${totalPeople} платили</div>
      </div>
    `;

    html += `
      <div class="section">
        <h2>Приходи</h2>

        ${
          incomes.length === 0
          ? `<div class="empty">Няма въведени приходи.</div>`
          : `
            <table>
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Описание</th>
                  <th class="amount">Приход</th>
                  <th>Начин на плащане</th>
                  <th>Статус</th>
                </tr>
              </thead>

              <tbody>

                ${incomes.map(item => `
                  <tr>
                    <td>${item.date}</td>
                    <td>${item.description}</td>
                    <td class="amount">
                      ${item.amount ? euro(item.amount) : ""}
                    </td>
                    <td>${item.payment}</td>
                    <td>${item.status}</td>
                  </tr>
                `).join("")}

              </tbody>
            </table>
          `
        }
      </div>
    `;

    html += `
      <div class="section">
        <h2>Разходи</h2>

        ${
          expenses.length === 0
          ? `<div class="empty">Няма въведени разходи.</div>`
          : `
            <table>
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Основание</th>
                  <th class="amount">Разход</th>
                </tr>
              </thead>

              <tbody>

                ${expenses.map(item => `
                  <tr>
                    <td>${item.date}</td>
                    <td>${item.reason}</td>
                    <td class="amount">
                      ${item.amount ? euro(item.amount) : ""}
                    </td>
                  </tr>
                `).join("")}

              </tbody>
            </table>
          `
        }
      </div>
    `;

    content.innerHTML = html;

  } catch (error) {

    content.innerHTML = `
      <div class="error">
        Данните не могат да бъдат заредени в момента.
        Моля, опитайте отново след малко.
      </div>
    `;

    console.error(error);
  }
}

loadData();

</script>

</body>
</html>
