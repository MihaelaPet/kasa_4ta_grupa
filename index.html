<!-- SheetJS -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>


<script>

const EXCEL_FILE = "каса_4група.xlsx";

const money = value => {

  if (value === null || value === undefined || value === "") {
    return "—";
  }

  const number = Number(value);

  if (Number.isNaN(number)) {
    return "—";
  }

  return new Intl.NumberFormat("bg-BG", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(number) + " €";
};


async function loadExcel(){

  try {

    /*
      Зареждаме Excel файла от същото GitHub
      repository, в което е index.html.
    */
    const response = await fetch(
      EXCEL_FILE + "?v=" + Date.now()
    );

    if (!response.ok) {
      throw new Error(
        "Excel файлът не може да бъде намерен."
      );
    }

    const arrayBuffer = await response.arrayBuffer();

    /*
      SheetJS прочита Excel файла.
    */
    const workbook = XLSX.read(arrayBuffer);

    /*
      Използваме първия лист от Excel файла.
    */
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];


    /*
      ==========================================
      ОБЩО ПРИХОДИ
      Excel клетка B35
      ==========================================
    */
    const incomeCell = sheet["B35"];

    const income =
      incomeCell ? incomeCell.v : null;


    /*
      ==========================================
      НАЛИЧНИ
      Excel клетка B36
      ==========================================
    */
    const balanceCell = sheet["B36"];

    const balance =
      balanceCell ? balanceCell.v : null;


    /*
      ==========================================
      РАЗХОДИ
      C2:C34
      ОСНОВАНИЕ
      D2:D34
      ==========================================
    */

    const expenses = [];

    for(let row = 2; row <= 34; row++){

      const expenseCell = sheet["C" + row];
      const descriptionCell = sheet["D" + row];

      const expense =
        expenseCell ? expenseCell.v : null;

      const description =
        descriptionCell ? descriptionCell.v : "";

      /*
        Показваме само редовете,
        в които има стойност за разход.
      */
      if(
        expense !== null &&
        expense !== undefined &&
        expense !== "" &&
        Number(expense) !== 0
      ){

        expenses.push({
          description:
            description !== null &&
            description !== undefined &&
            description !== ""
              ? String(description)
              : "Без описание",

          amount: Number(expense)
        });

      }

    }


    /*
      ==========================================
      ПОКАЗВАМЕ ОБЩО ПРИХОДИ
      ==========================================
    */

    document.getElementById("income").textContent =
      money(income);


    /*
      ==========================================
      ОБЩО РАЗХОДИ
      Сумираме C2:C34
      ==========================================
    */

    const totalExpense =
      expenses.reduce(
        (sum, item) => sum + item.amount,
        0
      );

    document.getElementById("expense").textContent =
      money(totalExpense);


    /*
      ==========================================
      ПОКАЗВАМЕ B36 - НАЛИЧНИ
      ==========================================
    */

    document.getElementById("balance").textContent =
      money(balance);


    /*
      ==========================================
      ПОКАЗВАМЕ РАЗХОДИТЕ
      ==========================================
    */

    const body =
      document.getElementById("body");


    if(expenses.length === 0){

      body.innerHTML = `
        <tr>
          <td colspan="2" class="message">
            Няма въведени разходи.
          </td>
        </tr>
      `;

      return;
    }


    body.innerHTML =
      expenses.map(item => `

        <tr>

          <td>
            ${escapeHtml(item.description)}
          </td>

          <td class="num">
            ${money(item.amount)}
          </td>

        </tr>

      `).join("");


  } catch(error){

    console.error(error);

    document.getElementById("income").textContent = "—";
    document.getElementById("expense").textContent = "—";
    document.getElementById("balance").textContent = "—";

    document.getElementById("body").innerHTML = `
      <tr>
        <td colspan="2" class="message">
          Данните не могат да бъдат заредени.
        </td>
      </tr>
    `;

    document.getElementById("error").innerHTML = `
      <div class="error">
        Excel файлът не може да бъде зареден.
        Провери дали името му е точно:
        <strong>${EXCEL_FILE}</strong>
      </div>
    `;

  }

}


/*
  Защита при показване на текст
  от Excel файла.
*/
function escapeHtml(value){

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/*
  Стартираме зареждането.
*/
loadExcel();

</script>
