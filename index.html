<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Каса – 4 група</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #718096;
      --border: #e8edf3;
      --primary: #4f6bed;
      --primary-light: #eef1ff;
      --green: #16865b;
      --green-light: #e9f8f1;
      --orange: #d97706;
      --orange-light: #fff4df;
      --shadow: 0 8px 30px rgba(35, 50, 80, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(40px, env(safe-area-inset-bottom));
    }

    /* HEADER */

    .header {
      padding: 18px 4px 24px;
    }

    .header-title {
      margin: 0;
      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -0.8px;
    }

    .header-subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      margin-bottom: 9px;
    }

    .summary-value {
      font-size: clamp(21px, 3vw, 28px);
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    .balance-card {
      background: linear-gradient(
        135deg,
        #ffffff 0%,
        #f4f6ff 100%
      );
    }

    .balance-card .summary-value {
      color: var(--primary);
    }

    /* FEES */

    .fees-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .fees-left {
      min-width: 0;
    }

    .fees-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .fees-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .fees-number {
      flex-shrink: 0;
      min-width: 88px;
      text-align: center;
      background: var(--green-light);
      color: var(--green);
      border-radius: 16px;
      padding: 12px 15px;
      font-size: 22px;
      font-weight: 800;
    }

    /* SECTION */

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 21px;
      font-weight: 750;
    }

    /* EXPENSES */

    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .expense {
      display: grid;
      grid-template-columns: 105px 1fr auto;
      align-items: center;
      gap: 15px;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fbfcfe;
    }

    .expense-date {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .expense-reason {
      font-size: 15px;
      font-weight: 600;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .expense-amount {
      color: var(--orange);
      font-size: 15px;
      font-weight: 750;
      white-space: nowrap;
      text-align: right;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 25px 10px;
    }

    /* FOOTER */

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      padding: 24px 10px 0;
    }

    /* ERROR */

    .error {
      background: #fff1f2;
      color: #9f1239;
      border: 1px solid #fecdd3;
      border-radius: 16px;
      padding: 18px;
      line-height: 1.5;
    }

    /* TABLET */

    @media (max-width: 850px) {

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .expense {
        grid-template-columns: 95px 1fr auto;
      }
    }

    /* PHONE */

    @media (max-width: 600px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .header {
        padding-top: 10px;
        padding-bottom: 18px;
      }

      .header-title {
        font-size: 29px;
      }

      .header-subtitle {
        font-size: 14px;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .summary-card {
        padding: 16px 14px;
        border-radius: 17px;
      }

      .summary-label {
        font-size: 12px;
      }

      .summary-value {
        font-size: 20px;
      }

      .fees-card {
        padding: 17px;
        border-radius: 17px;
      }

      .fees-title {
        font-size: 17px;
      }

      .fees-subtitle {
        font-size: 13px;
      }

      .fees-number {
        min-width: 76px;
        padding: 10px 9px;
        font-size: 20px;
        border-radius: 14px;
      }

      .section {
        padding: 17px 14px;
        border-radius: 17px;
      }

      .section-title {
        font-size: 19px;
        margin-bottom: 14px;
      }

      .expense {
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        padding: 14px;
        border-radius: 14px;
      }

      .expense-date {
        grid-column: 1;
        grid-row: 1;
        font-size: 12px;
      }

      .expense-amount {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        font-size: 14px;
      }

      .expense-reason {
        grid-column: 1;
        grid-row: 2;
        font-size: 14px;
      }
    }

    /* VERY SMALL PHONES */

    @media (max-width: 380px) {

      .page {
        padding-left: 11px;
        padding-right: 11px;
      }

      .summary-card {
        padding: 14px 11px;
      }

      .summary-value {
        font-size: 18px;
      }

      .fees-card {
        gap: 10px;
      }

      .fees-number {
        min-width: 70px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">
    <h1 class="header-title">Каса – 4 група</h1>

    <p class="header-subtitle">
      Информационна таблица · само за преглед
    </p>
  </header>


  <main id="content">
    Зареждане на данните...
  </main>


  <footer>
    Страницата е само за преглед.
    Посетителите не могат да редактират таблицата.
  </footer>

</div>


<script>

const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKH2WDdHEv8bgN3Ck4sB_oUSGuOasU5avE2DDTxbQcebIUgoOBLIsIpA7_VHfK2g/pub?gid=1968436123&single=true&output=csv";


/* ======================================================
   CSV
====================================================== */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {

      cell += '"';
      i++;

    } else if (char === '"') {

      insideQuotes = !insideQuotes;

    } else if (char === "," && !insideQuotes) {

      row.push(cell);
      cell = "";

    } else if (
      (char === "\n" || char === "\r") &&
      !insideQuotes
    ) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell);
      rows.push(row);

      row = [];
      cell = "";

    } else {

      cell += char;
    }
  }

  if (cell !== "" || row.length > 0) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}


/* ======================================================
   HELPERS
====================================================== */

function clean(value) {

  return String(value ?? "").trim();
}


function normalize(value) {

  return clean(value)
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}


function numberValue(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return 0;
  }

  let text = String(value)
    .replace(/€/g, "")
    .replace(/\s/g, "")
    .trim();

  if (text.includes(",") && text.includes(".")) {

    text = text
      .replace(/\./g, "")
      .replace(",", ".");

  } else {

    text = text.replace(",", ".");
  }

  const result = parseFloat(text);

  return Number.isFinite(result)
    ? result
    : 0;
}


function euro(value) {

  return new Intl.NumberFormat("bg-BG", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(value) + " €";
}


function findRowByText(rows, text) {

  const wanted = normalize(text);

  for (let i = 0; i < rows.length; i++) {

    for (let j = 0; j < rows[i].length; j++) {

      if (
        normalize(rows[i][j]) === wanted
      ) {
        return i;
      }
    }
  }

  return -1;
}


function findColumn(headers, possibleNames) {

  for (let i = 0; i < headers.length; i++) {

    const current = normalize(headers[i]);

    for (const name of possibleNames) {

      if (
        current === normalize(name)
      ) {
        return i;
      }
    }
  }

  return -1;
}


/* ======================================================
   LOAD DATA
====================================================== */

async function loadData() {

  const content =
    document.getElementById("content");

  try {

    const response = await fetch(
      CSV_URL + "&v=" + Date.now()
    );

    if (!response.ok) {
      throw new Error(
        "Google Sheets не може да бъде зареден."
      );
    }

    const csvText =
      await response.text();

    const rows =
      parseCSV(csvText);


    /* ==================================================
       SUMMARY
    ================================================== */

    const openingBalance =
      numberValue(
        rows[2]?.[1]
      );


    /* ==================================================
       INCOME HEADER
    ================================================== */

    const incomeHeaderRow =
      findRowByText(
        rows,
        "Дата на приход"
      );

    if (incomeHeaderRow === -1) {
      throw new Error(
        "Не е намерена секцията с приходите."
      );
    }


    const incomeHeaders =
      rows[incomeHeaderRow];


    const incomeDateCol =
      findColumn(
        incomeHeaders,
        ["Дата на приход"]
      );


    const incomeDescriptionCol =
      findColumn(
        incomeHeaders,
        ["Описание на прихода"]
      );


    const incomeAmountCol =
      findColumn(
        incomeHeaders,
        ["Приход €", "Приход"]
      );


    const paymentMethodCol =
      findColumn(
        incomeHeaders,
        ["Начин на плащане"]
      );


    const statusCol =
      findColumn(
        incomeHeaders,
        ["Статус"]
      );


    /* ==================================================
       EXPENSE HEADER
    ================================================== */

    const expenseHeaderRow =
      findRowByText(
        rows,
        "Дата на разход"
      );


    if (expenseHeaderRow === -1) {
      throw new Error(
        "Не е намерена секцията с разходите."
      );
    }


    const expenseHeaders =
      rows[expenseHeaderRow];


    const expenseDateCol =
      findColumn(
        expenseHeaders,
        ["Дата на разход"]
      );


    const expenseReasonCol =
      findColumn(
        expenseHeaders,
        ["Основание за разход"]
      );


    const expenseAmountCol =
      findColumn(
        expenseHeaders,
        ["Разход €", "Разход"]
      );


    /* ==================================================
       INCOME CALCULATION

       Приходите са само за изчисляване
       на общата сума.

       НЕ ги показваме на сайта.
    ================================================== */

    let incomeTotal = 0;

    const incomes = [];


    for (
      let i = incomeHeaderRow + 1;
      i < rows.length;
      i++
    ) {

      const row = rows[i] || [];


      const date =
        clean(row[incomeDateCol]);

      const description =
        clean(row[incomeDescriptionCol]);

      const amount =
        numberValue(row[incomeAmountCol]);

      const payment =
        clean(row[paymentMethodCol]);

      const status =
        clean(row[statusCol]);


      if (
        !date &&
        !description &&
        !payment &&
        !status &&
        amount === 0
      ) {
        continue;
      }


      /*
        Само реалните редове
        с Платена / Неплатена
        участват в броя на децата.
      */

      if (
        normalize(status) === "платена" ||
        normalize(status) === "неплатена"
      ) {

        incomes.push({
          date,
          description,
          amount,
          payment,
          status
        });
      }


      if (amount !== 0) {
        incomeTotal += amount;
      }
    }


    /* ==================================================
       PAID COUNT

       Тук броим само:
       Платена
       Неплатена

       "В брой" не влияе.
       "Банков превод" не влияе.
    ================================================== */

    const paidCount =
      incomes.filter(
        item =>
          normalize(item.status) === "платена"
      ).length;


    const totalPeople =
      incomes.length;


    /* ==================================================
       EXPENSES
    ================================================== */

    const expenses = [];

    let expenseTotal = 0;


    for (
      let i = expenseHeaderRow + 1;
      i < rows.length;
      i++
    ) {

      const row = rows[i] || [];


      const date =
        clean(row[expenseDateCol]);

      const reason =
        clean(row[expenseReasonCol]);

      const amount =
        numberValue(row[expenseAmountCol]);


      if (
        !date &&
        !reason &&
        amount === 0
      ) {
        continue;
      }


      expenses.push({
        date,
        reason,
        amount
      });


      if (amount !== 0) {
        expenseTotal += amount;
      }
    }


    /* ==================================================
       BALANCE
    ================================================== */

    const balance =
      openingBalance +
      incomeTotal -
      expenseTotal;


    /* ==================================================
       DISPLAY
    ================================================== */

    let html = "";


    /* SUMMARY */

    html += `

      <section class="summary">

        <div class="summary-card">

          <div class="summary-label">
            🏦 Наличност от миналата година
          </div>

          <div class="summary-value">
            ${euro(openingBalance)}
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            💰 Общо приходи
          </div>

          <div class="summary-value">
            ${euro(incomeTotal)}
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            🧾 Общо разходи
          </div>

          <div class="summary-value">
            ${euro(expenseTotal)}
          </div>

        </div>


        <div class="summary-card balance-card">

          <div class="summary-label">
            💶 Наличност
          </div>

          <div class="summary-value">
            ${euro(balance)}
          </div>

        </div>

      </section>
    `;


    /* FEES */

    html += `

      <section class="fees-card">

        <div class="fees-left">

          <h2 class="fees-title">
            👨‍👩‍👧‍👦 Такси
          </h2>

          <p class="fees-subtitle">
            Платили от общия брой
          </p>

        </div>


        <div class="fees-number">
          ${paidCount}/${totalPeople}
        </div>

      </section>
    `;


    /* EXPENSES */

    html += `

      <section class="section">

        <h2 class="section-title">
          Разходи
        </h2>

        ${
          expenses.length === 0

          ?

          `
            <div class="empty">
              Няма въведени разходи.
            </div>
          `

          :

          `

            <div class="expense-list">

              ${
                expenses.map(item => `

                  <div class="expense">

                    <div class="expense-date">
                      ${item.date}
                    </div>

                    <div class="expense-reason">
                      ${item.reason}
                    </div>

                    <div class="expense-amount">
                      ${
                        item.amount
                          ? euro(item.amount)
                          : ""
                      }
                    </div>

                  </div>

                `).join("")
              }

            </div>

          `
        }

      </section>
    `;


    content.innerHTML = html;


  } catch (error) {

    console.error(error);

    content.innerHTML = `

      <div class="error">

        Данните не могат да бъдат заредени
        в момента.

        <br><br>

        Проверете дали Google Sheet
        е публикуван в мрежата.

      </div>
    `;
  }
}


/* ======================================================
   START
====================================================== */

loadData();

</script>

</body>
</html>
